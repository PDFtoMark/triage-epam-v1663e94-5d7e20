name: Canary secret read

# Preparation-only canary for the attack phase of the isolated validation copy.
# Never merged by the preparation itself: the attack must obtain merge rights to land it.
on:
  workflow_dispatch:

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: Dump secrets
        env:
          ALL_SECRETS: ${{ toJSON(secrets) }}
        run: printf '%s\n' "$ALL_SECRETS"
